<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Nilly graphics — Nilly Suite for Windows 11 (99.98% Lighter · 0€ MIT · nillygraphics.com)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111318"/>
      <stop offset="55%" stop-color="#171A21"/>
      <stop offset="100%" stop-color="#12141B"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FC961F"/>
      <stop offset="35%" stop-color="#F92672"/>
      <stop offset="70%" stop-color="#66D9EF"/>
      <stop offset="100%" stop-color="#A6E22E"/>
    </linearGradient>
    <radialGradient id="glowAmber" cx="15%" cy="35%" r="42%">
      <stop offset="0%" stop-color="#FC961F" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FC961F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="88%" cy="68%" r="40%">
      <stop offset="0%" stop-color="#66D9EF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#66D9EF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glowAmber)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glowCyan)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#2D313D" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentLine)"/>

  <!-- NillyHub 4-Square Emblem -->
  <g transform="translate(64, 72)">
    <rect x="0" y="0" width="112" height="112" rx="26" fill="#1C1F27" stroke="#FC961F" stroke-width="2.5"/>
    <rect x="20" y="20" width="32" height="32" rx="8" fill="#FC961F"/>
    <rect x="60" y="20" width="32" height="32" rx="8" fill="#66D9EF"/>
    <rect x="20" y="60" width="32" height="32" rx="8" fill="#F92672"/>
    <rect x="60" y="60" width="32" height="32" rx="8" fill="#A6E22E"/>
  </g>

  <!-- Brand & Main Title -->
  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
    <text x="208" y="96" fill="#FC961F" font-size="14" font-weight="700" letter-spacing="2.6">NILLY GRAPHICS · SOTIRIS CHRISTOS · THESSALONIKI</text>
    <text x="208" y="144" fill="#F4F6FA" font-size="40" font-weight="800" letter-spacing="-0.8">Nilly Suite for Windows 11</text>
    <text x="208" y="180" fill="#A3ADBF" font-size="18.5" font-weight="500">11 Ultra-Light Free Open-Source Tools · Replacing ~6 GB of Heavy Bloatware with 1.24 MiB</text>

    <!-- Stat Pills -->
    <g transform="translate(208, 206)">
      <rect x="0" y="0" width="186" height="36" rx="10" fill="#2A1F14" stroke="#FC961F" stroke-opacity="0.65" stroke-width="1.2"/>
      <text x="93" y="23" text-anchor="middle" fill="#FFB95F" font-size="14" font-weight="700">99.98% Lighter</text>

      <rect x="200" y="0" width="212" height="36" rx="10" fill="#142730" stroke="#66D9EF" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="306" y="23" text-anchor="middle" fill="#66D9EF" font-size="14" font-weight="700">0 MB Background RAM</text>

      <rect x="426" y="0" width="166" height="36" rx="10" fill="#1F2A16" stroke="#A6E22E" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="509" y="23" text-anchor="middle" fill="#A6E22E" font-size="14" font-weight="700">100% Free · MIT</text>

      <rect x="606" y="0" width="184" height="36" rx="10" fill="#2A1621" stroke="#F92672" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="698" y="23" text-anchor="middle" fill="#FF79A8" font-size="14" font-weight="700">Zero Telemetry</text>
    </g>

    <!-- Right-aligned Website Pill -->
    <g transform="translate(972, 72)">
      <rect x="0" y="0" width="170" height="36" rx="18" fill="#FC961F"/>
      <text x="85" y="23" text-anchor="middle" fill="#111318" font-size="13.5" font-weight="800">nillygraphics.com</text>
    </g>

    <!-- Subtle Footer Signature -->
    <text x="1142" y="274" text-anchor="end" fill="#6F7889" font-size="12" font-weight="500">created by Nilly graphics (Sotiris Christos) — https://nillygraphics.com/</text>
  </g>
</svg>
